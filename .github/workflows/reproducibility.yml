name: Reproducibility Check

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  physics-smoke-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install numpy matplotlib

      - name: Run Day 1 physics engine (smoke test)
        env:
          PYTHONPATH: iterative_sprints
        run: python iterative_sprints/day_01/day_01_script.py

      - name: Run Day 4 noise/SNR verification
        env:
          PYTHONPATH: iterative_sprints
        run: python iterative_sprints/day_04/day_04_script.py
